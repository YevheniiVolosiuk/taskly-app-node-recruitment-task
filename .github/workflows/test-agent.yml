name: Test Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # read current labels and draft state
    outputs:
      run-agent: ${{ steps.classify.outputs.run-agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: List changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"

      # The live pull request, not the event payload, so re-runs see current labels and draft state.
      - name: Fetch pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull-request.json"

      - name: Classify
        id: classify
        run: |
          node tools/src/cli/classify.ts "$RUNNER_TEMP/changed-files" \
            "$RUNNER_TEMP/pull-request.json" "$RUNNER_TEMP/classification.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classification
          path: ${{ runner.temp }}/classification.json
          if-no-files-found: error

  verify:
    name: Verification Job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write # post the test-agent/verify commit status
    env:
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      STATUS_CONTEXT: test-agent/verify
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Fork and Dependabot PRs get a read-only token, so only other same-repo PRs post the status.
      - name: Mark status pending
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Running backend, frontend, and tools suites" -f target_url="$RUN_URL"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            tools/package-lock.json

      - name: Backend tests with coverage
        id: backend
        working-directory: backend
        run: |
          npm ci
          npm run test:coverage -- --coverage.reportOnFailure

      - name: Frontend tests with coverage
        id: frontend
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage -- --coverage.reportOnFailure

      - name: Tools tests
        id: tools
        if: ${{ !cancelled() }}
        working-directory: tools
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Upload backend coverage summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary-backend
          path: backend/coverage/coverage-summary.json
          if-no-files-found: warn

      - name: Upload frontend coverage summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary-frontend
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: warn

      - name: Post verification status
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
        run: |
          if [ "$JOB_STATUS" = cancelled ]; then
            state=error
          elif [ "$BACKEND_OUTCOME" = success ] && [ "$FRONTEND_OUTCOME" = success ] && [ "$TOOLS_OUTCOME" = success ]; then
            state=success
          else
            state=failure
          fi
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="backend: $BACKEND_OUTCOME, frontend: $FRONTEND_OUTCOME, tools: $TOOLS_OUTCOME" -f target_url="$RUN_URL"

  report:
    name: Report
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # upsert the sticky report comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: classification
          path: ${{ runner.temp }}

      - name: Render report
        run: |
          node tools/src/cli/report.ts "$RUNNER_TEMP/classification.json" "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Fork and Dependabot PRs get a read-only token, so they get the job summary only.
      - name: Upsert sticky comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ids=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- test-agent-report -->"))) | .id')
          comment_id=${ids%%$'\n'*}
          payload=$(jq -n --rawfile body "$RUNNER_TEMP/report.md" '{body: $body}')
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" --input - <<< "$payload"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --input - <<< "$payload"
          fi
